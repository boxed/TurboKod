[package]
name = "turbokod-render"
version = "0.0.1"
edition = "2021"
publish = false

# staticlib: produces a libturbokod_render.a we link into the Mojo binary
# alongside libturbokod_shim.a. Same rationale as turbokod-shim — a dylib
# would drag Rust's runtime in as a separate library and complicate the
# DYLD setup. This crate is the *native frontend*: it owns an NSWindow
# (via winit), rasterizes glyphs (fontdue + Core Text), and presents a
# CPU pixel buffer (softbuffer). The Mojo side drives it one frame at a
# time through winit's pump_app_events, so the event loop stays in Mojo.
[lib]
crate-type = ["staticlib"]
name       = "turbokod_render"

[dependencies]
winit         = "0.30"
softbuffer    = "0.4"
fontdue       = "0.9"

# macOS: Core Text supplies the OS font-fallback chain (emoji / CJK /
# symbols) that fontdue's fixed font list misses — same approach the
# app/ wrapper uses. Rendered to a grayscale (or ARGB, for color emoji)
# bitmap and dropped into the atlas like any other glyph.
[target.'cfg(target_os = "macos")'.dependencies]
core-text       = "20"
core-graphics   = "0.23"
core-foundation = "0.9"
# Native macOS menu bar (File ▸ New Window). Pinned to the same objc2 stack
# winit 0.30 pulls (objc2 0.5 / objc2-app-kit 0.2 / objc2-foundation 0.2) so
# the MainThreadMarker / NSMenu types unify with winit's — no duplicate objc2.
objc2            = "0.5"
objc2-app-kit    = "0.2"
objc2-foundation = "0.2"

[profile.release]
lto           = "thin"
codegen-units = 1
opt-level     = 3
